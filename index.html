<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mystery Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime&family=Vazirmatn:wght@300;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Vazirmatn', sans-serif;
            user-select: none;
        }

        /* --- Scene 1: Intro Message --- */
        #scene-intro {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #b00000;
            z-index: 3;
            background: #000;
        }

        .intro-text {
            font-size: 1.8rem;
            text-shadow: 0 0 15px #ff0000;
            padding: 20px;
            white-space: pre-wrap;
            direction: rtl;
            /* خط کنار متن حذف شد */
            border: none; 
        }

        /* --- Scene 2: Code Terminal --- */
        #scene-code {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2;
            direction: ltr;
        }

        .code-text {
            font-family: 'Courier Prime', monospace;
            color: #00ff41;
            font-size: 1.2rem;
            white-space: pre-wrap;
            padding: 20px;
            max-width: 80%;
            /* خط کنار متن حذف شد */
            border: none;
        }

        /* --- Scene 3: Game World --- */
        #scene-game {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #080808;
            display: none;
            z-index: 1;
            overflow: hidden;
        }

        .skyline {
            position: absolute;
            bottom: 50px;
            left: 0;
            width: 100%;
            height: 50%;
            display: flex;
            align-items: flex-end;
            opacity: 0.7;
            pointer-events: none;
        }

        .building {
            background-color: #020202;
            width: 8%;
            margin-right: 1%;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .building::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 3px;
            height: 3px;
            background: rgba(200, 200, 200, 0.2);
            box-shadow: 15px 30px rgba(255,255,255,0.1), -10px 60px rgba(255,255,255,0.05);
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: #111;
            border-top: 1px solid #222;
            z-index: 10;
        }

        #player-container {
            position: absolute;
            bottom: 45px;
            left: 80%;
            width: 130px;
            height: auto;
            z-index: 20;
            pointer-events: none; /* کلیک‌ها از روی کارکتر رد شوند */
        }

        #player-img {
            width: 100%;
            height: auto;
            transform-origin: bottom center;
            filter: drop-shadow(0 0 15px rgba(0,0,0,1));
            display: block;
        }

        /* --- ویژگی نخ (String) --- */
        /* این خط سفید کم‌رنگ از بالای کاراکتر تا آسمان کشیده می‌شود */
        #player-container::before {
            content: '';
            position: absolute;
            bottom: 85%; /* اتصال به ناحیه سر */
            left: 50%;
            width: 1px; /* ضخامت نخ */
            height: 200vh; /* ارتفاع خیلی زیاد که از صفحه بزنه بیرون */
            background: rgba(255, 255, 255, 0.3); /* رنگ سفید روح‌مانند */
            transform: translateX(-50%);
            z-index: -1; /* پشت کاراکتر */
            pointer-events: none;
        }

        /* انیمیشن راه رفتن */
        @keyframes walk-illusion {
            0% { transform: translateY(0) rotate(0deg) skewX(0deg) scaleX(var(--facing)); }
            25% { transform: translateY(-8px) rotate(3deg) skewX(-3deg) scaleX(var(--facing)); }
            50% { transform: translateY(0) rotate(0deg) skewX(0deg) scaleX(var(--facing)); }
            75% { transform: translateY(-8px) rotate(-3deg) skewX(3deg) scaleX(var(--facing)); }
            100% { transform: translateY(0) rotate(0deg) skewX(0deg) scaleX(var(--facing)); }
        }

        .walking {
            animation: walk-illusion 0.4s infinite linear;
        }

        /* نواحی کلیک */
        .control-layer {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            z-index: 100;
            cursor: pointer;
        }
        #left-click { left: 0; }
        #right-click { right: 0; }

    </style>
</head>
<body>

    <!-- صحنه ۱: تایپ فارسی -->
    <div id="scene-intro">
        <div class="intro-text" id="persian-typewriter"></div>
    </div>

    <!-- صحنه ۲: تایپ انگلیسی -->
    <div id="scene-code">
        <div class="code-text" id="english-typewriter"></div>
    </div>

    <!-- صحنه ۳: بازی -->
    <div id="scene-game">
        <div class="skyline" id="buildings-container"></div>
        <div class="ground"></div>
        
        <!-- کاراکتر و نخ داخل یک کانتینر -->
        <div id="player-container">
            <img id="player-img" src="https://s6.uupload.ir/files/inshot_۲۰۲۵۱۲۰۱_۱۹۱۶۳۲۶۳۱_byzf.png" style="--facing: 1;" alt="Character">
        </div>
        
        <!-- کنترل‌ها -->
        <div id="left-click" class="control-layer"></div>
        <div id="right-click" class="control-layer"></div>
    </div>

    <script>
        // --- تنظیمات متن‌ها ---
        const persianText = "ـ چرا اصلا داری بازی میکنی؟ \nاینجا هیچ چیزی در انتظارت نیست...";
        const englishText = "> SYSTEM BOOT...\n> START CHAPTER 1\n> In this world, everything is deceptive.\n> Trust nothing.\n> _";

        const introScene = document.getElementById('scene-intro');
        const persianDiv = document.getElementById('persian-typewriter');
        
        const codeScene = document.getElementById('scene-code');
        const englishDiv = document.getElementById('english-typewriter');
        
        const gameScene = document.getElementById('scene-game');
        
        // تغییر: ما کانتینر را حرکت می‌دهیم اما انیمیشن را روی تصویر اعمال می‌کنیم
        const playerContainer = document.getElementById('player-container');
        const playerImg = document.getElementById('player-img');

        // --- مرحله ۱: تایپ فارسی ---
        let pIndex = 0;
        function typePersian() {
            if (pIndex < persianText.length) {
                persianDiv.textContent += persianText.charAt(pIndex);
                pIndex++;
                setTimeout(typePersian, 80);
            } else {
                setTimeout(() => {
                    introScene.style.transition = 'opacity 1s';
                    introScene.style.opacity = '0';
                    setTimeout(() => {
                        introScene.style.display = 'none';
                        codeScene.style.display = 'flex';
                        typeEnglish();
                    }, 1000);
                }, 2000);
            }
        }

        setTimeout(typePersian, 500);

        // --- مرحله ۲: تایپ انگلیسی ---
        let eIndex = 0;
        function typeEnglish() {
            if (eIndex < englishText.length) {
                englishDiv.textContent += englishText.charAt(eIndex);
                eIndex++;
                setTimeout(typeEnglish, 40);
            } else {
                setTimeout(() => {
                    startGame();
                }, 3000);
            }
        }

        // --- مرحله ۳: شروع گیم پلی ---
        function startGame() {
            codeScene.style.display = 'none';
            gameScene.style.display = 'block';
            generateBuildings();
        }

        // --- منطق بازی ---
        let playerX = window.innerWidth * 0.8;
        let isMovingLeft = false;
        let isMovingRight = false;

        function generateBuildings() {
            const container = document.getElementById('buildings-container');
            for (let i = 0; i < 12; i++) {
                let b = document.createElement('div');
                b.className = 'building';
                b.style.height = Math.floor(Math.random() * 60 + 20) + '%';
                b.style.width = Math.floor(Math.random() * 8 + 4) + '%';
                container.appendChild(b);
            }
        }

        function gameLoop() {
            const speed = 4;
            
            if (isMovingLeft) {
                if (playerX > 0) playerX -= speed;
                playerImg.style.setProperty('--facing', '-1');
                if (!playerImg.classList.contains('walking')) playerImg.classList.add('walking');
            } 
            else if (isMovingRight) {
                if (playerX < window.innerWidth - 100) playerX += speed;
                playerImg.style.setProperty('--facing', '1');
                if (!playerImg.classList.contains('walking')) playerImg.classList.add('walking');
            } 
            else {
                playerImg.classList.remove('walking');
            }

            // حرکت دادن کل کانتینر (کارکتر + نخ)
            playerContainer.style.left = playerX + 'px';
            
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);

        // --- کنترل‌ها ---
        const leftZone = document.getElementById('left-click');
        const rightZone = document.getElementById('right-click');

        const startLeft = () => { isMovingLeft = true; isMovingRight = false; };
        const startRight = () => { isMovingRight = true; isMovingLeft = false; };
        const stopMove = () => { isMovingLeft = false; isMovingRight = false; };

        leftZone.addEventListener('mousedown', startLeft);
        leftZone.addEventListener('touchstart', (e) => { e.preventDefault(); startLeft(); });

        rightZone.addEventListener('mousedown', startRight);
        rightZone.addEventListener('touchstart', (e) => { e.preventDefault(); startRight(); });

        window.addEventListener('mouseup', stopMove);
        window.addEventListener('touchend', stopMove);

    </script>
</body>
</html>
