<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هوشیار - بازی هوش و سرگرمی</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --gold: #FFD700;
            --dark-gold: #D4AF37;
            --black: #000000;
            --dark-bg: #0a0a0a;
            --gray: #222222;
            --light-gray: #333333;
        }

        body {
            background-color: var(--black);
            color: var(--gold);
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* صفحه لودینگ */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--black);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #loading-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
        }

        .loading-bar-container {
            position: absolute;
            bottom: 50px;
            width: 80%;
            max-width: 500px;
            height: 10px;
            background: var(--gray);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--gold);
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold), var(--dark-gold));
            border-radius: 10px;
            transition: width 3s ease-in-out;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 10px var(--gold); }
            to { box-shadow: 0 0 20px var(--gold); }
        }

        /* صفحه منو */
        #menu-screen {
            display: none;
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('https://raw.githubusercontent.com/ahmadrezaei090-debug/Iran-rap/main/-2147483648_-219133.jpg') center/cover no-repeat;
        }

        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(3px);
        }

        .logo-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }

        .half-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            animation: rotate 10s linear infinite;
        }

        .half-circle::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--black) 50%, var(--gold) 50%);
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(to right, var(--gold), white);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            z-index: 10;
        }

        .settings-btn:hover {
            background: var(--gold);
            color: var(--black);
            transform: scale(1.05);
        }

        .menu-buttons {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 300px;
            z-index: 10;
        }

        .menu-btn {
            background: linear-gradient(45deg, var(--black), var(--gray));
            border: 3px solid var(--gold);
            color: var(--gold);
            padding: 20px;
            font-size: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent);
            transition: left 0.5s;
        }

        .menu-btn:hover::before {
            left: 100%;
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            display: flex;
            justify-content: space-around;
            border-top: 2px solid var(--gold);
            z-index: 10;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 16px;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 10px;
            transition: all 0.3s;
            position: relative;
        }

        .nav-item:hover {
            background: rgba(255, 215, 0, 0.1);
            transform: translateY(-3px);
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 5px;
        }

        /* صفحه انتخاب نوع بازی */
        #game-type-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
            z-index: 1000;
        }

        .game-type-panel {
            position: absolute;
            bottom: -400px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: linear-gradient(45deg, var(--black), var(--gray));
            border: 3px solid var(--gold);
            border-radius: 20px;
            padding: 30px;
            animation: slideUp 0.8s forwards;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        @keyframes slideUp {
            to { bottom: 50%; transform: translate(-50%, 50%); }
        }

        .game-type-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            color: var(--gold);
            text-shadow: 0 0 10px var(--gold);
        }

        .game-type-btn {
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid var(--gold);
            color: var(--gold);
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .game-type-btn:hover {
            background: var(--gold);
            color: var(--black);
            transform: scale(1.05);
        }

        /* صفحه بازی */
        #game-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
            z-index: 1001;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--gold);
        }

        .timer {
            font-size: 24px;
            color: var(--gold);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .lives {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .life {
            width: 30px;
            height: 30px;
            background: var(--gold);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .question-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--gold);
            border-radius: 20px;
            text-align: center;
        }

        .question-text {
            font-size: 24px;
            margin-bottom: 30px;
            line-height: 1.6;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .answer-input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid var(--gold);
            color: var(--gold);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .submit-btn {
            padding: 15px 40px;
            background: var(--gold);
            color: var(--black);
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--gold);
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 30px;
        }

        .option-btn {
            padding: 20px;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid var(--gold);
            color: var(--gold);
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-btn:hover {
            background: var(--gold);
            color: var(--black);
        }

        /* صفحه تنظیمات */
        #settings-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1002;
            backdrop-filter: blur(10px);
        }

        .settings-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            background: linear-gradient(45deg, var(--black), var(--gray));
            border: 3px solid var(--gold);
            border-radius: 20px;
            padding: 30px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .settings-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            color: var(--gold);
            text-shadow: 0 0 15px var(--gold);
        }

        .settings-item {
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid var(--gold);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
        }

        .settings-item:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: translateX(10px);
        }

        .coming-soon {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: 2px solid var(--gold);
            color: var(--gold);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
        }

        /* افکت‌های اضافی */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gold);
            color: var(--black);
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 1003;
            animation: slideDown 0.3s, fadeOut 0.3s 2.7s forwards;
        }

        @keyframes slideDown {
            from { top: -100px; }
            to { top: 20px; }
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1004;
        }

        .game-over-content {
            text-align: center;
            background: linear-gradient(45deg, var(--black), var(--gray));
            padding: 40px;
            border-radius: 20px;
            border: 3px solid var(--gold);
            animation: popIn 0.5s;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- صفحه لودینگ -->
    <div id="loading-screen">
        <img id="loading-image" src="https://raw.githubusercontent.com/ahmadrezaei090-debug/soberWeb/main/negin-art-1764247215354.png" alt="Loading">
        <div class="loading-bar-container">
            <div class="loading-bar" id="loading-bar"></div>
        </div>
    </div>

    <!-- صفحه منو -->
    <div id="menu-screen">
        <div class="menu-overlay"></div>
        
        <div class="logo-container">
            <div class="half-circle"></div>
            <div class="logo-text">هوشیار</div>
        </div>

        <button class="settings-btn" onclick="showSettings()">
            <i class="bi bi-gear"></i> تنظیمات
        </button>

        <div class="menu-buttons">
            <button class="menu-btn" onclick="showGameTypes()">
                <i class="bi bi-play-fill"></i> شروع بازی
            </button>
            <button class="menu-btn coming-soon" disabled>
                <i class="bi bi-globe"></i> بازی آنلاین (به زودی)
            </button>
        </div>

        <div class="bottom-nav">
            <button class="nav-item">
                <i class="bi bi-trophy"></i>
                <div>چالش‌ها</div>
            </button>
            <button class="nav-item">
                <i class="bi bi-signpost"></i>
                <div>مسیرها</div>
            </button>
            <button class="nav-item">
                <i class="bi bi-ticket"></i>
                <div>بلیط</div>
            </button>
        </div>
    </div>

    <!-- صفحه انتخاب نوع بازی -->
    <div id="game-type-screen">
        <div class="game-type-panel">
            <div class="game-type-title">نوع بازی را انتخاب کنید</div>
            <button class="game-type-btn" onclick="startGame('type1')">
                <i class="bi bi-lightning"></i>
                دونیم فلش (چیستان - تایپ جواب)
            </button>
            <button class="game-type-btn" onclick="startGame('type2')">
                <i class="bi bi-puzzle"></i>
                دو اولد (چهار گزینه‌ای)
            </button>
            <button class="game-type-btn" onclick="hideGameTypes()" style="background: rgba(255,0,0,0.1); border-color: #ff4444;">
                <i class="bi bi-x-circle"></i>
                بازگشت
            </button>
        </div>
    </div>

    <!-- صفحه بازی نوع اول -->
    <div id="game-screen">
        <div class="game-header">
            <div class="timer">زمان: <span id="time-left">17</span> ثانیه</div>
            <div class="lives">
                <div class="life"></div>
                <div class="life"></div>
                <div class="life"></div>
            </div>
        </div>

        <div class="question-container">
            <div class="question-text" id="question-text">سوال نمایش داده می‌شود...</div>
            
            <div id="type1-game" style="display: none;">
                <input type="text" class="answer-input" id="answer-input" placeholder="پاسخ خود را اینجا تایپ کنید...">
                <button class="submit-btn" onclick="checkAnswer()">ثبت پاسخ</button>
            </div>

            <div id="type2-game" style="display: none;">
                <div class="options-container">
                    <button class="option-btn" onclick="selectOption(0)">گزینه ۱</button>
                    <button class="option-btn" onclick="selectOption(1)">گزینه ۲</button>
                    <button class="option-btn" onclick="selectOption(2)">گزینه ۳</button>
                    <button class="option-btn" onclick="selectOption(3)">گزینه ۴</button>
                </div>
            </div>
        </div>
    </div>

    <!-- صفحه تنظیمات -->
    <div id="settings-screen">
        <div class="settings-panel">
            <div class="settings-title">تنظیمات</div>
            
            <div class="settings-item" onclick="showNotification('ارتباط با سازندگان: sober@game.com')">
                <i class="bi bi-envelope"></i>
                ارتباط با سازندگان
            </div>
            
            <div class="settings-item coming-soon">
                <i class="bi bi-clock"></i>
                به زودی‌ها
            </div>
            
            <div class="settings-item" onclick="toggleMotionGraphics()">
                <i class="bi bi-magic"></i>
                موشن گرافیک: <span id="motion-status">فعال</span>
            </div>
            
            <div class="settings-item" onclick="showNotification('افکت‌های صوتی فعال شدند')">
                <i class="bi bi-volume-up"></i>
                افکت‌های صوتی
            </div>

            <button class="back-btn" onclick="hideSettings()">
                <i class="bi bi-x"></i>
            </button>
        </div>
    </div>

    <!-- بازی تمام -->
    <div class="game-over" id="game-over">
        <div class="game-over-content">
            <h2 style="color: var(--gold); margin-bottom: 20px;">پایان بازی!</h2>
            <p id="final-score" style="font-size: 20px; margin-bottom: 30px;">امتیاز شما: 0</p>
            <button class="submit-btn" onclick="restartGame()" style="margin: 10px;">بازی مجدد</button>
            <button class="game-type-btn" onclick="backToMenu()" style="background: rgba(255,0,0,0.1);">بازگشت به منو</button>
        </div>
    </div>

    <script>
        // مدیریت لودینگ
        document.addEventListener('DOMContentLoaded', function() {
            // شبیه‌سازی لودینگ
            setTimeout(() => {
                const loadingBar = document.getElementById('loading-bar');
                loadingBar.style.width = '100%';
                
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('menu-screen').style.display = 'block';
                    showNotification('به بازی هوشیار خوش آمدید!');
                }, 3000);
            }, 500);
        });

        // آرایه‌های سوالات
        const type1Questions = [
            { question: "چه چیزی همیشه می‌آید اما هرگز نمی‌رسد؟", answer: "فردا" },
            { question: "هر چه بیشتر آن را بردارید، بزرگتر می‌شود چیست؟", answer: "چاله" },
            { question: "می‌شکنم اما نمی‌ریزم، می‌خورم اما سیر نمی‌شوم. چیستم؟", answer: "آتش" },
            // 67 سوال دیگر...
        ];

        const type2Questions = [
            { 
                question: "پایتخت کدام کشور آسیایی نیست؟", 
                options: ["توکیو", "پکن", "سئول", "مادرید"],
                answer: 3
            },
            { 
                question: "کدام حیوان در آب زندگی نمی‌کند؟", 
                options: ["ماهی", "وال", "خرس دریایی", "شیر"],
                answer: 3
            },
            // 68 سوال دیگر...
        ];

        // متغیرهای بازی
        let currentGameType = '';
        let currentQuestion = 0;
        let score = 0;
        let lives = 3;
        let timeLeft = 17;
        let timer;
        let motionGraphicsEnabled = true;

        // نمایش انواع بازی
        function showGameTypes() {
            document.getElementById('game-type-screen').style.display = 'block';
        }

        function hideGameTypes() {
            document.getElementById('game-type-screen').style.display = 'none';
        }

        // شروع بازی
        function startGame(type) {
            currentGameType = type;
            currentQuestion = 0;
            score = 0;
            lives = 3;
            
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-type-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            if (type === 'type1') {
                document.getElementById('type1-game').style.display = 'block';
                document.getElementById('type2-game').style.display = 'none';
                startTimer();
            } else {
                document.getElementById('type1-game').style.display = 'none';
                document.getElementById('type2-game').style.display = 'block';
            }
            
            loadQuestion();
        }

        // لود سوال
        function loadQuestion() {
            const questionText = document.getElementById('question-text');
            const livesElements = document.querySelectorAll('.life');
            
            // آپدیت جان‌ها
            livesElements.forEach((life, index) => {
                life.style.display = index < lives ? 'block' : 'none';
            });
            
            if (currentGameType === 'type1') {
                if (currentQuestion < type1Questions.length) {
                    questionText.textContent = `سوال ${currentQuestion + 1}: ${type1Questions[currentQuestion].question}`;
                    document.getElementById('answer-input').value = '';
                    timeLeft = 17;
                    document.getElementById('time-left').textContent = timeLeft;
                    startTimer();
                } else {
                    endGame();
                }
            } else {
                if (currentQuestion < type2Questions.length) {
                    questionText.textContent = `سوال ${currentQuestion + 1}: ${type2Questions[currentQuestion].question}`;
                    const options = document.querySelectorAll('.option-btn');
                    options.forEach((btn, index) => {
                        btn.textContent = type2Questions[currentQuestion].options[index];
                    });
                } else {
                    endGame();
                }
            }
        }

        // تایمر
        function startTimer() {
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    wrongAnswer();
                }
            }, 1000);
        }

        // بررسی جواب نوع اول
        function checkAnswer() {
            const userAnswer = document.getElementById('answer-input').value.trim().toLowerCase();
            const correctAnswer = type1Questions[currentQuestion].answer.toLowerCase();
            
            if (userAnswer === correctAnswer) {
                score += 10;
                showNotification('✅ پاسخ صحیح! +10 امتیاز');
                currentQuestion++;
                loadQuestion();
            } else {
                wrongAnswer();
            }
        }

        // انتخاب گزینه نوع دوم
        function selectOption(index) {
            const correctAnswer = type2Questions[currentQuestion].answer;
            
            if (index === correctAnswer) {
                score += 10;
                showNotification('✅ پاسخ صحیح! +10 امتیاز');
            } else {
                showNotification('❌ پاسخ اشتباه!');
            }
            
            currentQuestion++;
            loadQuestion();
        }

        // پاسخ اشتباه
        function wrongAnswer() {
            lives--;
            showNotification('❌ پاسخ اشتباه! یک جان از دست دادید');
            
            if (lives <= 0) {
                endGame();
            } else {
                currentQuestion++;
                loadQuestion();
            }
        }

        // پایان بازی
        function endGame() {
            clearInterval(timer);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('game-over').style.display = 'flex';
            document.getElementById('final-score').textContent = `امتیاز شما: ${score}`;
        }

        // شروع مجدد بازی
        function restartGame() {
            document.getElementById('game-over').style.display = 'none';
            startGame(currentGameType);
        }

        // بازگشت به منو
        function backToMenu() {
            document.getElementById('game-over').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
        }

        // تنظیمات
        function showSettings() {
            document.getElementById('settings-screen').style.display = 'block';
        }

        function hideSettings() {
            document.getElementById('settings-screen').style.display = 'none';
        }

        function toggleMotionGraphics() {
            motionGraphicsEnabled = !motionGraphicsEnabled;
            document.getElementById('motion-status').textContent = motionGraphicsEnabled ? 'فعال' : 'غیرفعال';
            showNotification(motionGraphicsEnabled ? 'موشن گرافیک فعال شد' : 'موشن گرافیک غیرفعال شد');
        }

        // نوتیفیکیشن
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // نمایش پیام‌های تعاملی
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const text = this.querySelector('div').textContent;
                showNotification(`${text} به زودی فعال خواهد شد`);
            });
        });
    </script>
</body>
                             </html>
